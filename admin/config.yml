backend:
  name: github
  repo: jonycusac-bot/Terrazas_Bel_Air
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "noticias"
    label: "Noticias"
    folder: "content/noticias"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Contenido", name: "body", widget: "markdown"}

  - name: "actas"
    label: "Actas"
    folder: "content/actas"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Documento PDF", name: "file", widget: "file"}

  - name: "avisos"
    label: "Avisos y Comunicados"
    folder: "content/avisos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Texto", name: "body", widget: "markdown"}
content/noticias/.gitkeep
content/actas/.gitkeep
content/avisos/.gitkeep

